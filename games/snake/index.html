<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>LoveHub Snake — نسخه‌ی نهایی</title>
  <link rel="icon" href="assets/logos/lovehub.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="bg-fx" aria-hidden="true">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <div class="blob b4"></div>
    </div>
    <canvas id="game-canvas"></canvas>

    <div id="hud" class="hidden">
      <div id="hud-top"></div>
      <div id="boss-area"></div>
      <div id="pu-chips"></div>
      <div id="dpad-root"></div>
    </div>

    <div id="ui-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <div id="cinematic-root"></div>
    <div id="loader">
      <div class="loader-logo">🐍</div>
      <div class="loader-bar"><div class="loader-fill"></div></div>
      <div class="loader-txt">LoveHub Snake</div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
